name: Publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  # Required: the OIDC token is how npm authenticates this workflow. No npm secret is involved.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      # Node 22 ships npm 10.x, which is too old for trusted publishing (11.5.1+ required,
      # 11.15+ for `npm trust`).
      - name: npm 11.15+ for trusted publishing
        run: npm install -g npm@^11.15.0 && npm --version
      - run: npm ci
      - run: npm run test:all
      - name: Check published version
        id: published
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "pi-job-listener@${version}" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "pi-job-listener@${version} is already published; skipping publish so tag pushes stay idempotent."
          fi
      - name: Publish
        if: steps.published.outputs.exists != 'true'
        # An empty NODE_AUTH_TOKEN is deliberate: setup-node configures a registry-url, and when an
        # auth token is present npm uses it instead of the OIDC exchange. OIDC needs it unset or empty.
        env:
          NODE_AUTH_TOKEN: ""
          NPM_CONFIG_IGNORE_SCRIPTS: "true"
        run: |
          set +e
          npm publish --access public > publish.log 2>&1
          code=$?
          cat publish.log
          if [ $code -ne 0 ]; then
            grep -E "npm error|EOTP|E403|E404|ENEEDAUTH|error" publish.log | head -20 | while IFS= read -r line; do
              echo "::error::publish: ${line}"
            done
          fi
          exit $code
